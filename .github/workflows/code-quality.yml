name: Quality
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  image-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: bash check-image.sh
