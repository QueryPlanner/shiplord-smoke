name: Bootstrap smoke image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: bash check-image.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/queryplanner/shiplord-smoke:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Report image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'ghcr.io/queryplanner/shiplord-smoke@%s\n' "$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
  tailnet:
    if: ${{ vars.SHIPLORD_TS_CLIENT_ID != '' && vars.SHIPLORD_SERVER_HOST != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf
        with:
          oauth-client-id: ${{ vars.SHIPLORD_TS_CLIENT_ID }}
          audience: ${{ vars.SHIPLORD_TS_AUDIENCE }}
          tags: ${{ vars.SHIPLORD_TS_TAGS || 'tag:ci' }}
          ping: ${{ vars.SHIPLORD_SERVER_HOST }}
